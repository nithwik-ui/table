<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SR University Timetable, Attendance & Academic Portal">

  <!-- Responsive & iOS Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#003870" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)">

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SRU Timetable">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Fast Preconnects to optimize font loading & assets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="icons/Icon-192.png" as="image">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SRU Timetable</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Instant PWA Zero-White-Screen Splash Loader (<20ms first paint, Light & Dark adaptive) */
    :root {
      --sru-bg: #F8FAFC;
      --sru-title: #0F172A;
      --sru-sub: #64748B;
      --sru-spinner-track: #E2E8F0;
      --sru-spinner-head: #003870;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --sru-bg: #0B1120;
        --sru-title: #F8FAFC;
        --sru-sub: #94A3B8;
        --sru-spinner-track: #1E293B;
        --sru-spinner-head: #60A5FA;
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--sru-bg);
      overflow: hidden;
    }
    #sru-pwa-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--sru-bg);
      z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .sru-splash-logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #003870;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(0, 56, 112, 0.35);
      margin-bottom: 20px;
      animation: sru-pulse 2s infinite ease-in-out;
    }
    .sru-splash-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--sru-title);
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }
    .sru-splash-sub {
      font-size: 13px;
      color: var(--sru-sub);
      margin-bottom: 26px;
      font-weight: 500;
    }
    .sru-splash-spinner {
      width: 26px;
      height: 26px;
      border: 3px solid var(--sru-spinner-track);
      border-top-color: var(--sru-spinner-head);
      border-radius: 50%;
      animation: sru-spin 0.8s linear infinite;
    }
    @keyframes sru-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes sru-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <!-- Immediate visual shell while Flutter compiles and boots -->
  <div id="sru-pwa-splash">
    <div class="sru-splash-logo">
      <img src="icons/Icon-192.png" alt="SRU Logo" style="width: 48px; height: 48px; border-radius: 10px;" />
    </div>
    <div class="sru-splash-title">SRU Timetable</div>
    <div class="sru-splash-sub">Academic Portal &amp; Schedule</div>
    <div class="sru-splash-spinner"></div>
  </div>

  <script>
    // Web Notification Bridge for Flutter PWA
    window.showPwaNotification = function(title, body, tag) {
      if (!('Notification' in window)) return false;
      if (Notification.permission === 'granted') {
        try {
          if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
            navigator.serviceWorker.ready.then(function(reg) {
              reg.showNotification(title, {
                body: body,
                icon: 'icons/Icon-192.png',
                badge: 'favicon.png',
                tag: tag || 'class_reminder',
                renotify: true,
                vibrate: [200, 100, 200]
              });
            });
            return true;
          }
        } catch (_) {}
        try {
          new Notification(title, {
            body: body,
            icon: 'icons/Icon-192.png',
            badge: 'favicon.png',
            tag: tag || 'class_reminder'
          });
          return true;
        } catch (_) {}
      }
      return false;
    };

    window.isPwaNotificationGranted = function() {
      return ('Notification' in window) && Notification.permission === 'granted';
    };

    window.requestPwaNotificationPermission = function() {
      if (!('Notification' in window)) return Promise.resolve('unsupported');
      return Notification.requestPermission();
    };

    // Eagerly register Firebase Messaging Service Worker for PWA Web Push
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('firebase-messaging-sw.js')
        .then(function (registration) {
          console.log('[PWA] Service Worker registered with scope:', registration.scope);
        })
        .catch(function (err) {
          console.warn('[PWA] Service Worker registration failed (non-fatal):', err);
        });
    }

    // Dismiss splash screen smoothly as soon as Flutter renders first frame
    function dismissSruSplash() {
      const splash = document.getElementById('sru-pwa-splash');
      if (splash && splash.style.display !== 'none') {
        splash.style.opacity = '0';
        splash.style.pointerEvents = 'none';
        setTimeout(function() {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 320);
      }
    }
    window.addEventListener('flutter-first-frame', dismissSruSplash);
    // Safety fallback: dismiss within 6 seconds if event is intercepted
    setTimeout(dismissSruSplash, 6000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
