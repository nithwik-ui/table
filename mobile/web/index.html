<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SR University Timetable, Attendance & Academic Portal">

  <!-- Responsive & iOS Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#003870">

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SRU Timetable">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SRU Timetable</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin: 0; background-color: #F8FAFC;">
  <script>
    // Register Firebase Messaging Service Worker for iPhone PWA and Web Push
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('firebase-messaging-sw.js')
          .then(function (registration) {
            console.log('Firebase Service Worker registered with scope:', registration.scope);
          })
          .catch(function (err) {
            console.warn('Firebase Service Worker registration failed (non-fatal):', err);
          });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
