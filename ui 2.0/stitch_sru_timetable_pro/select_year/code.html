<!-- Headline & Context -->

<div class="inline-flex items-center justify-center px-3 py-1 bg-surface-container-high rounded-full border border-outline-variant/30">

</div>
<!-- Year Selection Stack -->
<div class="flex flex-col gap-stack-gap w-full max-w-md mx-auto">

</div>
<div>

<p class="font-label-sm text-label-sm text-secondary">Semesters 1 &amp; 2</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Second Year Card (Selected State Example) -->

<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary"></div>

<div>

            Continue
            <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<script>
        // Simple mock interaction for demonstrating selection state toggle
        function selectYear(clickedCard) {
            // Reset all cards
            const allCards = document.querySelectorAll('button.group');
            allCards.forEach(card => {
                card.className = "group w-full bg-surface-container-lowest rounded-[16px] p-md flex items-center justify-between border border-outline-variant shadow-level-1 hover:shadow-level-2 hover:-translate-y-0.5 transition-all duration-200 active:scale-[0.98] active:shadow-level-1 relative overflow-hidden text-left";
                
                // Reset left bar
                card.querySelector('.absolute').className = "absolute left-0 top-0 bottom-0 w-1 bg-primary/20 group-hover:bg-primary transition-colors";
                
                // Reset icon container
                const iconContainer = card.querySelector('.flex.items-center.gap-md > div:first-child');
                iconContainer.className = "w-12 h-12 rounded-xl bg-surface-container-low flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors";
                
                // Reset text colors
                card.querySelector('h3').className = "font-headline text-headline text-on-surface group-hover:text-primary transition-colors";
                card.querySelector('p').className = "font-label-sm text-label-sm text-secondary";
                
                // Reset trailing icon (ensure it's a chevron and right color)
                const trailingElement = card.lastElementChild;
                if(trailingElement.tagName === 'SPAN') {
                     trailingElement.className = "material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors";
                     trailingElement.innerHTML = "chevron_right";
                     trailingElement.style = "";
                } else {
                     // Need to convert checkmark div back to chevron span
                     const newSpan = document.createElement('span');
                     newSpan.className = "material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors";
                     newSpan.setAttribute('data-icon', 'chevron_right');
                     newSpan.innerHTML = "chevron_right";
                     card.replaceChild(newSpan, trailingElement);
                }
            });

            // Set selected state classes on clicked card
            clickedCard.className = "group w-full bg-surface-container rounded-[16px] p-md flex items-center justify-between border-2 border-primary shadow-level-1 relative overflow-hidden text-left";
            
            // Set left bar active
            clickedCard.querySelector('.absolute').className = "absolute left-0 top-0 bottom-0 w-1 bg-primary";
            
            // Set icon container active
            const iconContainer = clickedCard.querySelector('.flex.items-center.gap-md > div:first-child');
            iconContainer.className = "w-12 h-12 rounded-xl bg-primary flex items-center justify-center text-on-primary";
            
            // Set text active
            clickedCard.querySelector('h3').className = "font-headline text-headline text-primary";
            clickedCard.querySelector('p').className = "font-label-sm text-label-sm text-primary/80";

            // Transform chevron into checkmark
            const trailingElement = clickedCard.lastElementChild;
            const checkContainer = document.createElement('div');
            checkContainer.className = "w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary";
            checkContainer.innerHTML = `<span class="material-symbols-outlined text-[16px]" data-icon="check" style="font-variation-settings: 'FILL' 1, 'wght' 700;">check</span>`;
            
            clickedCard.replaceChild(checkContainer, trailingElement);
        }
    </script>
